<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Rentals')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div th:replace="~{fragments :: alerts}"></div>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0"><i class="bi bi-calendar-check me-2"></i>Rentals</h1>
        <div class="btn-group">
            <a class="btn btn-sm btn-outline-secondary" href="/rentals">All</a>
            <a class="btn btn-sm btn-outline-warning" href="/rentals?view=active">Active</a>
            <a class="btn btn-sm btn-outline-danger" href="/rentals?view=overdue">Overdue</a>
            <a class="btn btn-sm btn-outline-success" href="/rentals?view=history">History</a>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white" th:text="${filter}">All rentals</div>
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead><tr><th>ID</th><th>Vehicle</th><th>Customer</th><th>Start → Due</th><th>Status</th><th>Cost</th><th></th></tr></thead>
                        <tbody>
                        <tr th:each="r : ${rentals}">
                            <td th:text="${r.code}"></td>
                            <td><strong th:text="${r.vehicle.make}"></strong> <span th:text="${r.vehicle.model}"></span></td>
                            <td th:text="${r.customer.name}"></td>
                            <td><span th:text="${r.startDate}"></span> → <span th:text="${r.dueDate}"></span></td>
                            <td>
                                <span class="badge" th:classappend="${r.active} ? 'bg-warning text-dark' : 'bg-success'"
                                      th:text="${r.active} ? 'ACTIVE' : 'RETURNED'"></span>
                            </td>
                            <td th:text="${#numbers.formatDecimal(r.totalCost(), 1, 2)}"></td>
                            <td>
                                <form th:if="${r.active}" th:action="@{'/rentals/' + ${r.id} + '/return'}" method="post" class="d-flex gap-1">
                                    <input class="form-control form-control-sm" type="date" name="returnDate" style="width:130px">
                                    <button class="btn btn-sm btn-outline-primary" title="Return vehicle"><i class="bi bi-arrow-return-left"></i></button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(rentals)}"><td colspan="7" class="text-muted text-center py-4">No rentals found</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white"><i class="bi bi-key me-2"></i>New rental</div>
                <div class="card-body">
                    <form th:action="@{/rentals}" method="post">
                        <div class="mb-2"><label class="form-label">Vehicle (available only)</label>
                            <select class="form-select" name="vehicleId" required>
                                <option th:each="v : ${availableVehicles}" th:value="${v.id}"
                                        th:text="${v.code + ' · ' + v.make + ' ' + v.model + ' · ' + #numbers.formatDecimal(v.dailyRate,1,2) + '/day'}"></option>
                            </select></div>
                        <div class="mb-2"><label class="form-label">Customer</label>
                            <select class="form-select" name="customerId" required>
                                <option th:each="c : ${customers}" th:value="${c.id}"
                                        th:text="${c.code} + ' · ' + ${c.name}"></option>
                            </select></div>
                        <div class="mb-3"><label class="form-label">Days</label>
                            <input class="form-control" type="number" name="days" min="1" value="3" required></div>
                        <button class="btn btn-primary w-100" th:disabled="${#lists.isEmpty(availableVehicles)}">
                            <i class="bi bi-key me-1"></i>Rent vehicle</button>
                    </form>
                    <div th:if="${#lists.isEmpty(availableVehicles)}" class="alert alert-warning small mt-3 mb-0">
                        No vehicles available right now.
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
